name: Build Debug APK

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update submodules (retry)
        run: |
          for i in 1 2 3; do
            git submodule update --init --recursive && break
            echo "Retry $i..."
            sleep 10
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install SDK packages WITHOUT ndk first (ndk zip often corrupts mid-download)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: Install NDK (retry, prefer preinstalled)
        run: |
          set -e
          NDK_VERSION="27.2.12479018"
          # Prefer any already-installed NDK 27.x on the runner image
          if [ -d "$ANDROID_HOME/ndk" ]; then
            echo "Existing NDKs:"
            ls -la "$ANDROID_HOME/ndk" || true
          fi
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already present"
          else
            # Fall back to another 27.x if present
            FOUND=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | grep '^27\.' | head -1 || true)
            if [ -n "$FOUND" ]; then
              echo "Using preinstalled NDK $FOUND"
              NDK_VERSION="$FOUND"
            else
              echo "Downloading NDK $NDK_VERSION with retries..."
              for i in 1 2 3 4 5; do
                if yes | sdkmanager --install "ndk;$NDK_VERSION"; then
                  echo "NDK install OK on attempt $i"
                  break
                fi
                echo "NDK install failed (attempt $i), cleaning partial and retrying..."
                rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" || true
                sleep 20
                if [ "$i" = "5" ]; then
                  echo "Trying alternate NDK 27.0.12077973..."
                  NDK_VERSION="27.0.12077973"
                  yes | sdkmanager --install "ndk;$NDK_VERSION" || true
                fi
              done
            fi
          fi
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "ERROR: NDK not available at $ANDROID_HOME/ndk/$NDK_VERSION"
            ls -la "$ANDROID_HOME/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "Using ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-debug-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List Debug APK files
        run: |
          echo "Debug APK files generated:"
          find app/build/outputs/apk -name "*.apk" -type f || echo "No APK files found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xelo-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
