name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: Install NDK (retry, prefer preinstalled)
        run: |
          set -e
          NDK_VERSION="27.2.12479018"
          if [ -d "$ANDROID_HOME/ndk" ]; then ls -la "$ANDROID_HOME/ndk" || true; fi
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already present"
          else
            FOUND=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | grep '^27\.' | head -1 || true)
            if [ -n "$FOUND" ]; then
              NDK_VERSION="$FOUND"
              echo "Using preinstalled NDK $FOUND"
            else
              for i in 1 2 3 4 5; do
                yes | sdkmanager --install "ndk;$NDK_VERSION" && break
                rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" || true
                sleep 20
              done
            fi
          fi
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List Release APK files
        run: |
          find app/build/outputs/apk -name "*.apk" -type f || echo "No APK files found"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xelo-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
